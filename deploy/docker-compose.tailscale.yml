# Mirage on a Synology, reachable over your tailnet at
# https://mirage.<your-tailnet>.ts.net with a real certificate and no reverse
# proxy, port forward, or certificate renewal to manage.
#
# Note the scheme is https, not http: `tailscale serve` terminates TLS with a
# certificate Tailscale issues for the ts.net name. That is the URL clients and
# external_url must use.
#
# This is `serve`, not `funnel`: reachable only from your tailnet, which is what
# you want for family access. Nothing is exposed to the public internet.
#
# Setup:
#   1. In the Tailscale admin console, enable MagicDNS and HTTPS certificates.
#      Serve cannot issue a certificate without both.
#
#   2. Generate a reusable auth key and put it in a .env file beside this one,
#      along with a password for the admin page:
#        TS_AUTHKEY=tskey-auth-...
#        MIRAGE_ADMIN_PASSWORD=something-long-and-random
#
#      Then read the note on key expiry under TS_EXTRA_ARGS below. Left alone,
#      this node drops off your tailnet when the key expires and sync stops
#      working months later for no visible reason.
#
#   3. Create the directories the stack mounts, and copy three files into
#      /volume1/docker/mirage:
#
#        sudo mkdir -p /volume1/docker/mirage/{config,data}
#
#      Files, noting that the two configuration files sit at different
#      levels because of how each is mounted:
#
#        /volume1/docker/mirage/
#        |-- docker-compose.yml        (this file)
#        |-- tailscale-serve.json      (beside the compose file)
#        |-- .env                      (TS_AUTHKEY, MIRAGE_ADMIN_PASSWORD)
#        |-- config/
#        |   `-- mirage.yaml           (inside config/, from mirage.example.yaml)
#        `-- data/
#
#      A mirage.yaml left in the top directory is silently unused, and Mirage
#      exits with "read config: open /etc/mirage/mirage.yaml: no such file".
#
#      tailscale-serve.json is bind-mounted from beside this file, so leaving
#      it behind stops the stack with "Bind mount failed: ... does not exist"
#      before anything starts.
#
#      In config/mirage.yaml, two settings must agree with this file:
#        server:
#          listen: "127.0.0.1:8080"
#          external_url: "https://mirage.<your-tailnet>.ts.net"
#
#      listen binds to loopback because the only way in is through the sidecar.
#      external_url is baked into the pairing URLs handed to clients, so it has
#      to be the name they actually resolve; getting it wrong pairs and hangs.
#      The file lists no accounts - those are added from the admin page.
#
#   4. docker compose -f docker-compose.tailscale.yml up -d
#   5. docker compose -f docker-compose.tailscale.yml exec mirage mirage doctor
#   6. Open https://mirage.<your-tailnet>.ts.net/admin and add accounts.
#
# Family members install the Nextcloud client and enter the same ts.net URL.

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: mirage-tailscale
    hostname: mirage # becomes mirage.<your-tailnet>.ts.net
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in a .env file beside this compose file}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking avoids needing /dev/net/tun and NET_ADMIN, which
      # Synology's Container Manager does not always grant.
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      # Auth keys expire, and so do the nodes authenticated with one. When that
      # happens the NAS silently leaves the tailnet and every client stops
      # syncing, months after a setup that appeared to work. Pick one fix:
      #
      #   - Simplest: after the node first appears in the Tailscale admin
      #     console, open it and turn off key expiry.
      #
      #   - Tidier: run it as a tagged node, which never expires. The tag name
      #     is yours to choose; it just has to exist before it can be used.
      #     In the tailnet policy file:
      #
      #       "tagOwners": { "tag:family": ["autogroup:admin"] }
      #
      #     Then issue the auth key with that tag selected, and uncomment the
      #     line below with the same name. Enabling it without both steps makes
      #     the container fail to start rather than fall back.
      #
      #     A tagged node is owned by the tag rather than by you, so if your
      #     policy file is not the default allow-all, it needs a rule letting
      #     the people you are sharing with reach it - for example:
      #
      #       {"action": "accept", "src": ["autogroup:member"],
      #        "dst": ["tag:family:443"]}
      #
      # TS_EXTRA_ARGS: --advertise-tags=tag:family
    volumes:
      # A named volume rather than a bind mount: this is opaque node state, so
      # there is nothing to gain from a known path, and Docker creates a named
      # volume by itself instead of refusing to start over a missing directory.
      - mirage-tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mirage:
    # Pulled, not built: the NAS has no source tree and no git. The image is
    # published by CI for both linux/amd64 and linux/arm64, and the NAS picks
    # the one that matches itself.
    image: ghcr.io/poitch/mirage:latest
    pull_policy: always
    container_name: mirage
    restart: unless-stopped

    # Share the sidecar's network namespace so `tailscale serve` can reach
    # Mirage on 127.0.0.1. There is deliberately no `ports:` block: Mirage
    # should bind to 127.0.0.1 and be reachable only through the tailnet.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy

    volumes:
      - /volume1/docker/mirage/config:/etc/mirage:ro
      - /volume1/docker/mirage/data:/var/lib/mirage
      - ${MIRAGE_HOMES_PATH:-/volume1/homes}:/volumes/homes

    environment:
      TZ: Etc/UTC
      MIRAGE_CONFIG: /etc/mirage/mirage.yaml
      # Accounts are managed from the admin page at /admin. Set a password in a
      # .env file beside this compose file; without one the page is not served.
      MIRAGE_ADMIN_USERNAME: ${MIRAGE_ADMIN_USERNAME:-admin}
      MIRAGE_ADMIN_PASSWORD: ${MIRAGE_ADMIN_PASSWORD:?set MIRAGE_ADMIN_PASSWORD in a .env file beside this compose file}

    # Root is required for cross-user chown, but nothing else is.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
    security_opt:
      - no-new-privileges:true

volumes:
  mirage-tailscale-state:
