# Mirage server configuration.
#
# This file is the source of truth for which accounts exist and where each one
# stores its files. Passwords are not kept here; set them with
# `mirage user passwd <username>`.

server:
  listen: ":8080"

  # The URL clients actually reach this server on, as they would type it into
  # the Nextcloud client. Mirage bakes it into the login and push URLs it hands
  # out, so a container-internal address here will break client pairing.
  # Use https in production: sync clients send credentials on every request.
  external_url: "https://nas.example.com"

database:
  # Index and credentials. Holds no file content, so losing it costs a rescan.
  path: /var/lib/mirage/mirage.db

storage:
  # Permissions stamped on everything Mirage creates. 0640/0750 keeps files
  # private to the owning user and their group.
  file_mode: "0640"
  dir_mode: "0750"

  # How long to wait *between* full reconciliation walks. This is the backstop
  # that catches changes made over SMB or in File Station when the filesystem
  # watcher misses them.
  #
  # The gap is measured from the end of one walk to the start of the next, so a
  # walk that takes longer than the interval does not queue the next one. Even
  # so, set this against how long a walk actually takes on your share - the
  # "scan complete" log line reports it. On a large share a walk can take the
  # better part of an hour, and an interval near that keeps the disks working
  # almost continuously for very little benefit. Hours, not minutes, is right
  # for a big share. Zero disables it and leaves everything to the watcher.
  rescan_interval: 6h

  # Gap between quick passes. These read directory timestamps rather than
  # stat'ing every file, so they find anything added, removed or renamed -
  # which is what dropping a file over SMB looks like - at a fraction of the
  # cost of a full walk. They cannot see a file rewritten in place under the
  # same name; the full rescan above is the backstop for those.
  #
  # This is what decides how long a file dropped over SMB takes to appear on
  # clients, on a share too large for the kernel to watch every directory of.
  #
  # A quick pass costs one stat per directory, so on a share with hundreds of
  # thousands of them it is minutes rather than seconds. Measure yours before
  # choosing a number:
  #
  #     mirage scan -quick
  #
  # Whatever is set here, Mirage will not spend more than a quarter of its time
  # scanning: a pass that takes longer than the gap after it widens the gap
  # rather than starting the next one immediately, and says so in the log.
  quick_rescan_interval: 5m

  # Watch the filesystem for changes as they happen, which is faster than any
  # scan.
  #
  # Each directory needs its own kernel watch, and the default allowance is a
  # few thousand against a large share's hundreds of thousands of directories.
  # Rather than try to cover the tree, Mirage spends the watches it can have on
  # the directories that changed most recently - the ones in daily use - and
  # leaves the archives to the periodic passes. So a change in a folder somebody
  # actually uses shows up in about a second, and one in a folder untouched for
  # years waits for the next pass.
  watcher: true

  # How many directories may be watched. Zero takes a share of what the kernel
  # allows. Raising the kernel's own limit lets more of the tree be watched -
  # on Synology, `sysctl -w fs.inotify.max_user_watches=1048576`, made
  # permanent as a boot-up task in DSM's Task Scheduler - but each watch costs
  # kernel memory, and a share that keeps growing will always outrun it.
  max_watches: 0

  # How many directory timestamps a quick pass reads at once. Zero derives a
  # figure.
  #
  # A quick pass is one stat per indexed directory. On a share too large for the
  # kernel to keep that metadata cached, each one is a disk seek, and a seek is
  # spent waiting - so reading them one at a time leaves the drive idle most of
  # the time. Issued together they queue and the drive reorders them, and on an
  # array they spread across spindles.
  #
  # This is the setting that decides how soon a file dropped over SMB appears on
  # your clients. Time a pass at a few values to find the right one for your
  # disks: `mirage scan -quick -workers 32 -v`. Past the storage's queue depth
  # it stops helping, and on a single spinning disk it eventually hurts.
  scan_workers: 0

  # Entry names never indexed or synced, matched at any depth. filepath.Match
  # syntax, so "*.tmp" works as well as a plain name.
  #
  # Nothing is excluded by default: these are your files. The reason to set it
  # is cost. A source checkout's .svn directory or a node_modules tree can hold
  # millions of tiny files that dominate every scan and are rebuilt from
  # elsewhere anyway; excluding them can take a walk from an hour to minutes.
  # Excluding something already synced makes it disappear from clients, which
  # does not touch the copies on the NAS.
  exclude: []
  #  - .svn
  #  - node_modules
  #  - .git

# Accounts are managed from the admin page at /admin, so there is usually no
# users: section here at all. Sign in with MIRAGE_ADMIN_USERNAME and
# MIRAGE_ADMIN_PASSWORD from the compose file.
#
# Declaring users here instead makes this file authoritative and the admin page
# read-only. That suits a setup kept under version control, where the config
# should be the single record of who exists. Pick one; running both is legal but
# confusing.
#
# users:
#   # `home` is the path *inside the container*, which is not the path on the
#   # NAS. The compose file mounts the homes directory - wherever it lives, see
#   # MIRAGE_HOMES_PATH - at /volumes/homes, so an account on
#   # /volumeN/homes/alice is written here as /volumes/homes/alice.
#   #
#   # `uid` and `gid` must match the NAS account that owns that directory, or
#   # files Mirage writes will be unreadable over SMB. Find them with `id alice`
#   # over SSH. `mirage doctor` verifies the mapping and warns on a mismatch.
#   - username: alice
#     display_name: Alice
#     home: /volumes/homes/alice
#     uid: 1026
#     gid: 100
#     quota: 107374182400   # 100 GiB; omit or set 0 for unlimited
