<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Device connected &middot; Mirage</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --card: #ffffff; --fg: #1c1e21; --muted: #61656c;
    --line: #d9dce1; --ok: #1a7f4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --card: #1e2126; --fg: #e8eaed; --muted: #9aa0a8;
      --line: #31353c; --ok: #4ec27f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 25rem; background: var(--card); text-align: center;
    border: 1px solid var(--line); border-radius: 12px; padding: 2rem 1.75rem;
  }
  .tick {
    width: 2.75rem; height: 2.75rem; margin: 0 auto 1rem; border-radius: 50%;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok);
    font-size: 1.4rem; font-weight: 700;
  }
  h1 { margin: 0 0 .4rem; font-size: 1.2rem; }
  p { margin: 0; color: var(--muted); font-size: .9rem; }
</style>
<main class="card">
  <div class="tick" aria-hidden="true">&check;</div>
  <h1>Device connected</h1>
  <p>{{ .Device }} can now sync your files. You can close this window.</p>
</main>
