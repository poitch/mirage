{{ template "head" . }}
<style>
  body { display: grid; place-items: center; padding: 1.5rem; }
  main { width: 100%; max-width: 21rem; }
  p.sub { margin: 0 0 1rem; }
  input { max-width: none; }
  button[type=submit] { width: 100%; margin-top: 1.25rem; }
</style>
<main>
  <div class="card pad">
    <h1>Sign in</h1>
    <p class="sub">Use your Mirage account, the same one your sync client uses.</p>
    {{ if .Error }}<p class="banner">{{ .Error }}</p>{{ end }}
    <form method="post" action="/web/login">
      <input type="hidden" name="next" value="{{ .Next }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocapitalize="none" autocorrect="off"
             spellcheck="false" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</main>
