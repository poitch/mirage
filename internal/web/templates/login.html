{{ template "head" . }}
<style>
  body { display: grid; place-items: center; padding: 1.5rem; }
  main { width: 100%; max-width: 21rem; }
  p.sub { margin: 0 0 1rem; }
  input { max-width: none; }
  button[type=submit] { width: 100%; margin-top: 1.25rem; }
</style>
<main>
  <div class="card pad">
    <h1>{{ .T "login.title" }}</h1>
    <p class="sub hint">{{ .T "login.sub" }}</p>
    {{ if .Error }}<p class="banner">{{ .Error }}</p>{{ end }}
    <form method="post" action="/web/login">
      <input type="hidden" name="next" value="{{ .Next }}">
      <label for="username">{{ .T "login.username" }}</label>
      <input id="username" name="username" type="text" autocapitalize="none" autocorrect="off"
             spellcheck="false" autocomplete="username" required autofocus>
      <label for="password">{{ .T "login.password" }}</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">{{ .T "login.submit" }}</button>
    </form>
  </div>
</main>
