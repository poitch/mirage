{{ define "head" }}
<!doctype html>
<html lang="{{ .Lang }}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{ .Title }} &middot; Mirage</title>
<style>
  /* The palette and the scale are shadcn's, written out as custom properties
     rather than generated by Tailwind. The look is the part worth having; the
     build step that normally comes with it is not, for a page of six templates
     shipped inside a Go binary that has to work on a NAS with no internet. */
  :root {
    color-scheme: light dark;
    --background: #ffffff;
    --foreground: #09090b;
    --card: #ffffff;
    --muted: #f4f4f5;
    --muted-foreground: #71717a;
    --border: #e4e4e7;
    --input: #e4e4e7;
    --primary: #18181b;
    --primary-foreground: #fafafa;
    --accent: #f4f4f5;
    --destructive: #dc2626;
    --ring: #a1a1aa;
    --radius: 0.5rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #09090b;
      --foreground: #fafafa;
      --card: #0c0c0f;
      --muted: #18181b;
      --muted-foreground: #a1a1aa;
      --border: #27272a;
      --input: #27272a;
      --primary: #fafafa;
      --primary-foreground: #18181b;
      --accent: #1c1c20;
      --destructive: #ef4444;
      --ring: #52525b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--background); color: var(--foreground);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  header {
    border-bottom: 1px solid var(--border); background: var(--background);
    padding: 0 1.25rem; height: 3.5rem; display: flex; align-items: center; gap: 1.5rem;
    position: sticky; top: 0; z-index: 10;
  }
  header .brand { font-weight: 600; letter-spacing: -.01em; }
  header nav { display: flex; gap: 1.25rem; font-size: .875rem; }
  header nav a { color: var(--muted-foreground); text-decoration: none; transition: color .15s; }
  header nav a:hover { color: var(--foreground); }
  header .spacer { flex: 1; }

  main { max-width: 56rem; margin: 0 auto; padding: 1.75rem 1.25rem 4rem; }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.015em; margin: 0 0 .25rem; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0 0 .25rem; }
  p.hint, .note { color: var(--muted-foreground); font-size: .8125rem; }
  .note { margin: 1rem 0 0; }

  .crumbs { font-size: .875rem; margin: 0 0 1rem; color: var(--muted-foreground); word-break: break-word; }
  .crumbs a { text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs .sep { padding: 0 .4rem; opacity: .5; }
  .crumbs .here { color: var(--foreground); font-weight: 500; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .card.pad { padding: 1.25rem; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .625rem .875rem; border-bottom: 1px solid var(--border); }
  th {
    font-size: .75rem; font-weight: 500; color: var(--muted-foreground);
    background: var(--muted);
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--accent); }
  tr.hit td { background: var(--muted); box-shadow: inset 2px 0 0 var(--foreground); }
  td.size, th.size { text-align: right; white-space: nowrap; color: var(--muted-foreground);
                     font-variant-numeric: tabular-nums; }
  td.when, th.when { white-space: nowrap; color: var(--muted-foreground); font-size: .8125rem; }
  @media (max-width: 40rem) { td.when, th.when { display: none; } }
  td a { text-decoration: none; font-weight: 500; }
  td a:hover { text-decoration: underline; }
  .empty { padding: 2.5rem .875rem; text-align: center; color: var(--muted-foreground); }

  .icon-cell { display: flex; align-items: center; gap: .625rem; min-width: 0; }
  .icon-cell .label { min-width: 0; overflow-wrap: anywhere; }
  .icon { width: 1.25rem; text-align: center; opacity: .7; flex: none; }
  .thumb {
    width: 2.25rem; height: 2.25rem; object-fit: cover; flex: none;
    border-radius: calc(var(--radius) - 2px); background: var(--muted);
  }
  .where { color: var(--muted-foreground); font-size: .75rem; }
  td.actions-cell { text-align: right; white-space: nowrap; }
  td.actions-cell form { display: inline; }
  td.actions-cell a, td.actions-cell button.link { margin-left: .875rem; font-size: .8125rem; }

  button, .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 2.25rem; padding: 0 .875rem; font: inherit; font-size: .875rem; font-weight: 500;
    color: var(--primary-foreground); background: var(--primary);
    border: 1px solid transparent; border-radius: calc(var(--radius) - 2px);
    cursor: pointer; text-decoration: none; transition: opacity .15s;
  }
  button:hover, .btn:hover { opacity: .9; }
  button.secondary {
    background: var(--background); color: var(--foreground); border-color: var(--border);
  }
  button.secondary:hover { background: var(--accent); }
  button.link {
    height: auto; padding: 0; background: none; border: 0; font-weight: 500;
    color: var(--muted-foreground); text-decoration: none;
  }
  button.link:hover { color: var(--foreground); text-decoration: underline; }
  button.danger { color: var(--destructive); }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

  label { display: block; font-size: .8125rem; font-weight: 500; margin: .875rem 0 .375rem; }
  /* Matched by what an input is not, rather than by type. An input with no
     type attribute is a text field, but input[type=text] does not match one -
     the selector tests the attribute, not the default it stands in for. */
  input:not([type=hidden]):not([type=file]):not([type=checkbox]):not([type=radio]) {
    width: 100%; max-width: 22rem; height: 2.25rem; padding: 0 .75rem;
    font: inherit; font-size: .875rem; color: var(--foreground);
    background: var(--background); border: 1px solid var(--input);
    border-radius: calc(var(--radius) - 2px); outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--ring); }
  form.search { display: flex; gap: .5rem; margin: 0 0 1rem; }
  form.search input { max-width: none; flex: 1; }

  .banner {
    padding: .75rem .875rem; border-radius: calc(var(--radius) - 2px); font-size: .8125rem;
    margin-bottom: 1rem; border: 1px solid var(--destructive); color: var(--destructive);
  }
  .banner.ok { border-color: var(--border); background: var(--muted); color: var(--foreground); }

  .stack > div + div { margin-top: 1.5rem; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  .qr { max-width: 14rem; margin: .875rem 0; }
  .qr svg { width: 100%; height: auto; display: block; border-radius: calc(var(--radius) - 2px); }
  code.url {
    display: block; padding: .625rem .75rem; margin: .625rem 0; background: var(--muted);
    border-radius: calc(var(--radius) - 2px); font-size: .75rem;
    overflow-wrap: anywhere; color: var(--muted-foreground);
  }
</style>
{{ end }}

{{ define "nav" }}
<header>
  <span class="brand">Mirage</span>
  <nav>
    <a href="/web/">{{ .T "nav.files" }}</a>
    <a href="/web/trash">{{ .T "nav.trash" }}</a>
    <a href="/web/profile">{{ .Username }}</a>
  </nav>
  <span class="spacer"></span>
  <form method="post" action="/web/logout">
    <input type="hidden" name="csrf" value="{{ .CSRF }}">
    <button class="link" type="submit">{{ .T "nav.signout" }}</button>
  </form>
</header>
{{ end }}
